stages:
  - ci

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  NODE_OPTIONS: "--max-old-space-size=4096"

.node_setup:
  image: docker:latest
  services:
    - docker:dind
    - node:22
  cache:
    - key:
        files:
          - yarn.lock
      paths:
        - node_modules/
        - .yarn/install-state.gz
        - .yarn/cache/
        - .pnp.cjs
        - .pnp.loader.mjs
      policy: pull-push
    - key: typecheck-cache
      paths:
        - server/.tsbuildinfo
        - ui/.next/cache/
        - shared/.tsbuildinfo
      policy: pull-push
  before_script:
    - apk update && apk add bash
    - apk add --no-cache nodejs npm icu-data-full
    - npm install -g yarn
    - yarn config set networkConcurrency 1
    - yarn config set enableGlobalCache true
    - yarn config set compressionLevel 0
    - yarn config set httpTimeout 600000
    - yarn config set enableProgressBars true
    - yarn config set httpsProxy http://proxy.tec.in.phm.education.gouv.fr:3128
    - yarn config set httpProxy http://proxy.tec.in.phm.education.gouv.fr
    - yarn install
    - yarn dedupe --check

# Stage lint
lint:
  extends: .node_setup
  stage: ci
  script:
    - yarn lint:ci
    - echo "Lint passed"
  timeout: 10 minutes

typecheck:
  extends: .node_setup
  stage: ci
  script:
    - yarn typecheck:ci
    - echo "Typecheck passed"
  timeout: 20 minutes

tests:
  extends: .node_setup
  stage: ci
  script:
    - docker compose up -d --wait postgres
    - yarn test:ci
    - echo "Tests passed"
  timeout: 10 minutes

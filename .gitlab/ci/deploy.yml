.deploy_base:
  stage: deploy
  image: alpine:latest
  before_script:
    - |
      [ -z "$VERSION" ] && echo "VERSION is not set" && exit 1
      [ -z "$DEPLOY_PASS" ] && echo "DEPLOY_PASS is not set" && exit 1
      [ -z "$DEPLOY_SSH_PRIVATE_KEY" ] && echo "DEPLOY_SSH_PRIVATE_KEY is not set" && exit 1
      [ -z "$VAULT_PWD" ] && echo "VAULT_PWD is not set" && exit 1
    - apk add --no-cache openssh-client ansible bash
    - yarn config set https-proxy http://proxy.tec.in.phm.education.gouv.fr:3128
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - ssh-add -l
    - echo "Private key added"
    - echo "$VAULT_PWD" > .infra/.vault_pwd.txt
    - echo "Vault password file created"

deploy_qualification:
  stage: deploy
  extends: .deploy_base
  allow_failure: true
  variables:
    ANSIBLE_VAULT_PASSWORD_FILE: .infra/.vault_pwd.txt
    ANSIBLE_REMOTE_USER: deploy
    ANSIBLE_BECOME_PASS: $DEPLOY_PASS
    ENVIRONMENT: qualification
    ANSIBLE_HOST_KEY_CHECKING: "False"  # Add this to disable host key checking in Ansible
  before_script:
    - !reference [.deploy_base, before_script]
    - ssh-keyscan -H 'qa.orion.education.gouv.fr' >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - ls -la ~/.ssh
    - cat ~/.ssh/known_hosts
    - echo "Testing SSH connection..."
    - ssh -v -o StrictHostKeyChecking=no deploy@qa.orion.education.gouv.fr "echo 'SSH connection successful'" || echo "SSH test failed"
  script:
    - |
      # Retrieve new version
      echo "Deploying version $VERSION"
      echo "Deployment to $ENVIRONMENT"
    - .bin/product deploy qualification --extra-vars "app_version=$VERSION"
  environment:
    name: qualification
    deployment_tier: development
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "develop"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

